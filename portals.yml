# -- Search queries --

search_queries:
  # -- AI/ML Engineer --
  - name: Greenhouse — AI/ML Engineer new grad
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" "new grad" OR "entry level" OR "university"'
    enabled: true

  - name: Ashby — AI/ML Engineer new grad
    query: 'site:jobs.ashbyhq.com "AI Engineer" OR "ML Engineer" OR "Machine Learning Engineer" "new grad" OR "entry level"'
    enabled: true

  - name: Lever — AI/ML Engineer new grad
    query: 'site:jobs.lever.co "AI Engineer" OR "ML Engineer" OR "Applied AI" "new grad" OR "entry level" OR "university"'
    enabled: true

  # -- Research Engineer --
  - name: Greenhouse — Research Engineer
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Research Engineer" OR "Applied Scientist" "new grad" OR "entry level"'
