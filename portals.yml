  # -- LinkedIn (local parser: Webscrapper/webscrapper.py guest-API scraper) --

  - name: LinkedIn
    careers_url: https://www.linkedin.com/jobs/search/
    scan_method: local_parser
    parser:
      command: python3
      script: Webscrapper/linkedin_scan_parser.py
      format: jobs-json-v1
      timeout_ms: 1800000
      max_buffer_bytes: 8000000
    notes: "Guest-API scraper over 25 keywords (config: Webscrapper/config.json — 24h window, citizenship/clearance/sponsorship desc filters, fit score). Live scrape ~9 min; parser reuses linkedin_jobs.csv when <6h old. Force refresh: python3 Webscrapper/linkedin_scan_parser.py --fresh. Emitted URLs are the EMPLOYER's apply link, not linkedin.com/jobs/view — the parser resolves them via linkedin_apply.py (needs LINKEDIN_COOKIE: .venv-jobspy/bin/python linkedin_login.py). Easy Apply postings have no employer URL and keep their LinkedIn link. Rows that miss the per-run lookup budget are repaired by linkedin_relink.py in run_scan.sh."
    enabled: true

  # -- JobSpy (local parser: multi-board scraper — Indeed / Google / ZipRecruiter) --

  - name: JobSpy
    careers_url: https://www.indeed.com/
    scan_method: local_parser
    parser:
      command: python3
      script: jobspy_scan_parser.py
      format: jobs-json-v1
      timeout_ms: 1200000
      max_buffer_bytes: 16000000
    notes: "python-jobspy over 8 archetype searches (config: jobspy_config.json). LinkedIn is excluded by default — the LinkedIn entry above already scrapes it and two scrapers in one run trip its rate limit. Clearance/citizenship words are filtered in the parser (scan.mjs never sees descriptions); title/location/blacklist filters apply here like any provider. Cache: jobspy_jobs.csv, reused when <6h old — force refresh with `python3 jobspy_scan_parser.py --fresh`. Needs .venv-jobspy (python3 -m venv .venv-jobspy && .venv-jobspy/bin/pip install -U python-jobspy)."
    enabled: true

  # -- JobRight (local parser: 2026 new-grad GitHub job lists) --

  - name: JobRight
    careers_url: https://jobright.ai/
    scan_method: local_parser
    parser:
      command: python3
      script: jobright_scan_parser.py
      format: jobs-json-v1
      timeout_ms: 1800000
      max_buffer_bytes: 8000000
    notes: "jobright-ai/2026-Software-Engineer-New-Grad + 2026-Data-Analysis-New-Grad README tables. Replaces the old `python3 jobright.py data/pipeline.csv` step, which appended straight to pipeline.csv — those rows bypassed every filter and were wiped by the next sync_pipeline_csv.py run. Links are jobright.ai redirects, so dedup_pipeline.py prefers an employer ATS copy of the same role."
