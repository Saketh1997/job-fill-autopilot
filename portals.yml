# Portal Scanner Configuration
# Target level: New Grad / early career
# Last updated: April 2026

# -- Scan options --
scan_options:
  posted_within_hours: 24   # Only surface jobs posted within this window
                             # Scan mode appends "after:YYYY-MM-DD" to WebSearch queries
                             # and discards any result whose posting date is older than this threshold.
                             # Set to null to disable the filter and return all results.

# -- Candidate profile --
candidate:
  level: "Intern-New Grad"
  primary:
    - "AI Engineer"
    - "ML Engineer"
    - "Data Scientist"
    - "ML Infrastructure Engineer"
    - "Data Engineer"
    - "Research Engineer (DB/Systems)"
    - "DevOps/Platform Engineer"
    - "Robotics Software Engineer"
    - "Embedded/Firmware Engineer"
  archetypes:
    - name: "AI/ML Engineer"
      level: "Intern-New Grad"
      fit: "primary"
    - name: "Data Scientist"
      level: "Intern-New Grad"
      fit: "primary"
    - name: "Data Engineer"
      level: "Intern-New Grad"
      fit: "primary"
    - name: "ML Infrastructure Engineer"
      level: "Intern-New Grad"
      fit: "primary"
    - name: "Research Engineer (DB/Systems)"
      level: "Intern-New Grad"
      fit: "secondary"
    - name: "DevOps/Platform Engineer"
      level: "Intern-New Grad"
      fit: "secondary"
    - name: "Robotics Software Engineer"
      level: "Intern-New Grad"
      fit: "secondary"
    - name: "Research Scientist"
      level: "Intern-New Grad"
      fit: "adjacent"
    - name: "Embedded/Firmware Engineer"
      level: "Intern-New Grad"
      fit: "adjacent"

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- AI/ML core --
    - "AI Engineer"
    - "ML Engineer"
    - "Machine Learning Engineer"
    - "Applied AI"
    - "Applied ML"
    - "Applied Scientist"
    - "Research Engineer"
    # "Research Scientist" removed 2026-09-22: PhD-track; queue_gate.py rejects it
    - "LLM Engineer"
    - "LLMOps"
    - "MLOps"
    - "ML Infrastructure"
    - "AI Infrastructure"
    - "Model Engineer"
    - "NLP Engineer"
    - "Computer Vision Engineer"
    - "Deep Learning Engineer"
    - "Generative AI"
    - "GenAI"
    # -- Data --
    - "Data Engineer"
    - "Data Scientist"
    - "Data Platform"
    - "Analytics Engineer"
    # -- ML Systems / Platform / Infra (ML-infra archetype) --
    - "Platform Engineer"
    - "Infrastructure Engineer"
    - "Kubernetes"
    - "Backend Engineer"
    - "Systems Engineer"
    - "Database Engineer"
    # added 2026-09-19 for the database companies below
    - "Database"
    - "PostgreSQL"
    - "Postgres"
    - "Query Engine"
    - "Query Processing"
    - "Storage Engineer"
    - "Distributed Systems"
    # -- Robotics (adjacent) --
    - "Robotics Engineer"
    - "Robotics Software"
    - "ROS"
    - "Autonomous"
    # -- Generic SWE (added 2026-08-05) --
    # New-grad boards (JobRight, Indeed) title most roles plainly "Software
    # Engineer", so without these the whole general-SWE new-grad market was
    # invisible: 788 of 798 rows in the JobRight SWE repo failed for having no
    # positive keyword. These three are broad on purpose — the stack filtering
    # for them happens in content_filter.by_title_keyword below, against the JD
    # text, because a title alone cannot tell an ML-adjacent "Software Engineer"
    # from an iOS one.
    - "Software Engineer"
    - "Software Developer"
    - "Software Development Engineer"
    # Added 2026-09-24: AI labs and infra startups (Gimlet Labs, Anthropic,
    # Nous...) title most engineering roles "Member of Technical Staff".
    # queue_gate already exempts it from the "staff" reject; the lane gate
    # still checks the JD, so off-lane MTS roles are filtered there.
    - "Member of Technical Staff"
    - "Technical Staff"
  negative:
    # Exclude stacks with no profile overlap
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    # Bare, not "Frontend Engineer": with generic SWE titles allowed, the
    # variants "Software Engineer, Frontend" and "Frontend Software Engineer"
    # slipped past the two-word form (observed 2026-08-05 — Glean, TikTok, Hadrian).
    - "Frontend"
    - "Front End"
    - "Front-End"
    - "UI Engineer"
    - "QA Engineer"
    # -- Off-stack titles surfaced by the generic "Software Engineer" positives
    #    (added 2026-08-05). Titles only; the JD-level check is in content_filter.
    - "Mobile"
    - "Swift"
    - "Kotlin"
    - "React Native"
    - "Flutter"
    - "Xamarin"
    - "Objective-C"
    - "Salesforce"
    - "ServiceNow"
    - "SharePoint"
    - "WordPress"
    - "Drupal"
    - "Quality Assurance"
    - "Test Engineer"
    - "Support Engineer"
    - "Field Engineer"
    - "Sales Development"
    - "Technical Recruiter"
    - "Account Executive"
    - "Sales Engineer"   # remove if open to SE roles
    # -- Off-archetype infra/hardware (cut to reduce scan noise; re-add if targeting) --
    - "DevOps"
    - "Site Reliability"
    - "SRE"
    - "Embedded"
    - "Firmware"
    # -- Seniority exclusions (intern/new-grad target; keeps zero-token scan.mjs
    #    from flooding the pipeline with senior roles — added 2026-07-05) --
    - "Senior"
    - "Sr."
    - "Sr "
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Manager"
    - "Management"
    - "Distinguished"
    - "Architect"
    - "Evangelist"
    - "Vice President"
    - "Chief "
    # -- Clearance / citizenship, title-level (for candidates without a clearance).
    #    The JD-level rule already exists; these catch the aggregator feeds
    #    (JobSpy, JobRight) that state it in the title, e.g.
    #    "Data Scientist - Multiple Levels (TS/SCI with Poly Required)".
    - "TS/SCI"
    - "Clearance"
    - "Polygraph"
    - "US Citizen"
    - "U.S. Citizen"
  seniority_boost:
    # These add relevance score but are not required — new grad roles often lack these prefixes
    - "New Grad"
    - "Entry Level"
    - "University Grad"
    - "Junior"           # moved from negative — valid at new grad level
    # "Intern" removed 2026-09-22: queue_gate.py rejects intern titles
    - "Associate"

# -- Content filter --
# Runs against the JOB DESCRIPTION, so it can separate same-titled roles with
# different stacks. Added 2026-08-05 together with the generic "Software
# Engineer" title positives: a plain "Software Engineer" title says nothing
# about the stack, and an iOS or Android role posted under that title is off
# archetype.
#
# `by_title_keyword` scopes a rule to jobs whose title matched a specific
# `title_filter.positive` keyword — so this strictness applies ONLY to the three
# generic SWE titles. An "ML Engineer" or "Data Engineer" title never gets here.
#
# Semantics (scan.mjs buildContentFilter, mirrored in scan_common.py):
#   - no description available -> PASS (never penalize missing provider data)
#   - any `negative` term present -> reject
#   - otherwise at least one `positive` term must be present
#
# Negatives are deliberately TOOL names (xcode, cocoapods, jetpack compose)
# rather than the bare words "ios"/"android": most backend JDs mention "our iOS
# and Android apps" in passing, and blocking on that would drop real matches.

content_filter:
  by_title_keyword:
    "Software Engineer": &generic_swe_stack
      negative:
        # Mobile-only stacks
        - "xcode"
        - "cocoapods"
        - "swiftui"
        - "objective-c"
        - "swift developer"
        - "ios developer"
        - "ios engineer"
        - "ios application"
        - "android studio"
        - "android developer"
        - "android engineer"
        - "jetpack compose"
        - "react native"
        - "flutter"
        - "xamarin"
        # NOTE: bare "kotlin" and "swift" are deliberately absent. Polyglot
        # employers (DoorDash, Robinhood, Amazon) list every language they use
        # in one JD, so those two words dropped real backend roles. The tokens
        # above name mobile TOOLING, which a backend JD has no reason to carry.
        # Enterprise / low-code / legacy stacks with no profile overlap
        - "salesforce"
        # Phrase-scoped, not bare: SharePoint and ServiceNow show up in plenty
        # of JDs as internal tooling or a benefits-portal mention. Bare tokens
        # dropped an Esri C++ maps role and RTX/Collins engineering roles for
        # words that had nothing to do with the stack.
        - "servicenow developer"
        - "servicenow platform"
        - "sharepoint developer"
        - "sharepoint administrator"
        - "wordpress developer"
        - "drupal developer"
        - "cobol"
        - "mainframe"
        - "abap"
        - "visual basic"
        - "vb.net"
        - "powerbuilder"
      positive:
        # At least one has to appear, so a "Software Engineer" posting that is
        # really a non-technical or wrong-domain role does not slip through.
        - "python"
        - "machine learning"
        - "deep learning"
        - "artificial intelligence"
        - "data pipeline"
        - "data engineering"
        - "backend"
        - "back-end"
        - "distributed systems"
        - "microservices"
        - "kubernetes"
        - "docker"
        - "aws"
        - "gcp"
        - "azure"
        - "sql"
        - "postgres"
        - "spark"
        - "kafka"
        - "c++"
        - "golang"
        - "rust"
        - "api"
        # Generic engineering signals, so a real but vaguely-written SWE posting
        # is not dropped for lacking a named stack. Anything with none of these
        # is not a software role in the first place.
        - "algorithms"
        - "data structures"
        - "software development"
        - "linux"
        - "git"
        - "ci/cd"
        - "database"
    "Software Developer": *generic_swe_stack
    "Software Development Engineer": *generic_swe_stack

# -- Experience filter --
# No professional experience yet (new grad). experience_gate.py fetches each
# new offer's JD and blocks it when the minimum required years exceed this.
# Offers whose JD states no years requirement (or can't be fetched) pass.


# --- queue_gate.py (added 2026-09-22) ---------------------------------------
# Runs in run_scan.sh after experience_gate.py, so every source (scan.mjs APIs,
# local parsers, relinks) is gated before anything reaches the fill queue.
# Why: 1,048 applications had piled up at a few companies (TikTok 118,
# Anthropic 43) and ~1 in 6 titles were unwinnable (intern, PhD, research
# scientist, 2027 cohorts). A recruiter sees every application from one
# candidate on a single ATS profile.
queue_gate:
  window_days: 90            # rolling window for the per-company cap
  cap_large: 3               # max on-lane applications per large company per window
  cap_startup: 1             # every company not listed under large_companies
  # Companies already OVER their cap get zero new applications until this many
  # days after their most recent application (not just until the window rolls).
  over_cap_cooldown_days: 180
  # Whole-word, case-insensitive title rejects. Word boundaries keep
  # "Internal Tools" and "Member of Technical Staff" alive.
  title_reject:
    - senior
    - sr
    - staff
    - principal
    - lead
    - intern
    - interns
    - internship
    - co-op
    - research scientist
    - phd
    - ui
    - support
    - it infrastructure
    - it support
    - it controls
    - mid-level
    - mid level
    - network engineer
    - network infrastructure
    - data center
  title_reject_exempt:
    - member of technical staff
  # Titles naming a graduation cohort later than this year:
  # "2027 Start", "Summer 2027", "2027 Grads", "Class of 2027".
  reject_cohort_years_after: 2026
  # Core lanes: titles here enter without a JD check.
  lane_titles:
    - database
    - postgres
    - postgresql
    - query engine
    - query processing
    - storage
    - data engineer
    - data platform
    - data infrastructure
    - analytics engineer
    - platform engineer
    - infrastructure
    - infra
    - ml infrastructure
    - ai infrastructure
    - mlops
    - llmops
    - distributed systems
  # Every other title (new-grad SWE, MLE, backend, data scientist, research
  # engineer, robotics...) enters only if its cached JD names at least one
  # STRONG term and lane_jd_min_hits terms in total. WEAK terms appear in almost
  # every software JD ("SQL databases", "Linux"), so they only count toward the
  # total. No JD on disk = not verifiable = dropped.
  lane_jd_min_hits: 2
  lane_jd_strong:
    - postgresql
    - postgres
    - kubernetes
    - k8s
    - distributed systems
    - distributed system
    - database internals
    - query optimization
    - query engine
    - storage engine
    - data infrastructure
    - spark
    - kafka
    - flink
    - airflow
    - ml infrastructure
    - machine learning infrastructure
    - model serving
    - inference
    - training infrastructure
    - mlops
    - cuda
    - pytorch
    - tensorflow
    - jax
    - large language models
    - model training
    - training pipelines
    - vector database
  lane_jd_weak:
    - databases
    - sql
    - etl
    - data pipelines
    - data pipeline
    - linux
    - docker
    - terraform
    - observability
    - prometheus
    - gpu
    - llm
    - llms
    - embeddings
    - retrieval
    - rag
  # Name variants that are one employer on one ATS.
  company_aliases:
    amazon.com services: amazon
    amazon web services: amazon
    amazon development center u.s.: amazon
    aws: amazon
    bytedance: tiktok
    tiktok usds: tiktok
    hud: hud
  large_companies:
    - amazon
    - tiktok
    - nvidia
    - microsoft
    - meta
    - google
    - apple
    - oracle
    - ibm
    - adobe
    - qualcomm
    - intel
    - micron
    - tesla
    - spacex
    - general motors
    - jpmorganchase
    - databricks
    - snowflake
    - palantir
    - uber
    - doordash
    - netflix
    - spotify
    - paypal
    - robinhood
    - roblox
    - salesforce
    - cisco
    - capital one
    - booz allen hamilton
    - cgi
    - hp
    - openai
    - anthropic

experience_filter:
  max_required_years: 1

# -- Location filter --
# Block-list only (no allow list) so that empty/ambiguous locations
# ("2 Locations", "Remote") still pass.
# Added 2026-07-05 as US-only. Widened 2026-09-22
# to also admit the Netherlands, Australia, Japan, Austria, Canada and the rest
# of Europe (UK, DE, FR, IE, CH, ES, PL, Nordics, ...). What stays blocked is
# everything outside those regions. Watch substrings: "India" would also
