  - name: LinkedIn — SWE/ML new grad WITH visa sponsorship
    query: 'site:linkedin.com/jobs/view "Software Engineer" OR "ML Engineer" OR "Data Engineer" "new grad" OR "entry level" "visa sponsorship" OR "will sponsor" OR "sponsorship available"'
    enabled: true

  - name: Greenhouse — new grad SWE/ML sponsorship available
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Software Engineer" OR "ML Engineer" OR "Data Engineer" "new grad" OR "entry level" "visa sponsorship" OR "sponsor"'
    enabled: true

  - name: Ashby — new grad SWE/ML sponsorship available
    query: 'site:jobs.ashbyhq.com "Software Engineer" OR "ML Engineer" OR "AI Engineer" "new grad" OR "entry level" "visa" OR "sponsor"'
    enabled: true

  - name: jobright H1B-tracked new grad tech roles
    query: 'site:github.com jobright-ai Daily-H1B-Jobs OR "New-Grad-Positions" "Software Engineer" OR "ML Engineer" OR "Data Engineer" H1B sponsorship'
    enabled: true

  - name: Simplify / GitHub new grad lists — H1B sponsoring
    query: '"New Grad" OR "entry level" "Software Engineer" OR "Machine Learning" "H1B" OR "visa sponsorship" 2026 github.com/SimplifyJobs OR github.com/speedyapply'
    enabled: true


